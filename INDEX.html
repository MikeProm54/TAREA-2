<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de tareas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1><strong>Gestor</strong> de tareas</h1>
    <p>Agrega, edita y elimina tus tareas. Se guardan en este navegador.</p>
  </header>

  <main>
    <form id="formulario-tarea" novalidate>
      <label for="nueva-tarea">Nueva tarea</label>
      <div class="fila">
        <input type="text" id="nueva-tarea" maxlength="80" autocomplete="off" required>
        <button type="submit" class="boton">Agregar Tarea</button>
      </div>
      <p id="mensaje" class="mensaje" role="alert"></p>
    </form>

    <section aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Mis tareas</h2>
      <p id="contador" aria-live="polite"></p>
      <ul id="lista-tareas"></ul>
      <p id="vacio">Aún no tienes tareas.</p>
    </section>
  </main>
</body>
</html>
